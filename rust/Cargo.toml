[package]
name = "kras-quick"
version = "3.0.2"
edition = "2021"

[[bin]]
name = "kras-quick"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "ndarray", "tls-rustls"] }
regex = "1"
quick-xml = { version = "0.38.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = "0.30"
ureq = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory"] }
zip = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
